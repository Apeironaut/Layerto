services:
  postgres:
    image: postgres:16-alpine
    container_name: layerto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: layerto
      POSTGRES_PASSWORD: layerto
      POSTGRES_DB: layerto
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layerto -d layerto"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
