# ==============================================================================
# Layerto HTTP Security Headers & SPA Configuration (SPEC §13 / M5)
# ==============================================================================
#
# Usage in Nginx:
#   server {
#       listen 443 ssl http2;
#       server_name app.layerto.com;
#       root /var/www/layerto/web/dist;
#       index index.html;
#
#       include /etc/nginx/conf.d/headers.conf;
#
#       # SPA fallback: unknown paths route to index.html
#       location / {
#           try_files $uri $uri/ /index.html;
#       }
#   }
#
# Usage in Caddy:
#   app.layerto.com {
#       root * /var/www/layerto/web/dist
#       encode gzip zstd
#       file_server
#
#       header {
#           Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.layerto.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
#           X-Content-Type-Options "nosniff"
#           Referrer-Policy "strict-origin-when-cross-origin"
#           X-Frame-Options "DENY"
#           Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
#       }
#
#       # SPA fallback
#       try_files {path} /index.html
#   }
# ==============================================================================

# 1. Content Security Policy (CSP)
# - No inline scripts allowed (script-src 'self' only).
# - No external Google Fonts (self-hosted fonts or native system font stack: style-src 'self', font-src 'self').
# - frame-ancestors 'none' prevents any site from embedding Layerto in an iframe (clickjacking protection).
# - NOTE ON connect-src:
#   At deployment, replace __API_ORIGIN__ with your target core API origin
#   (e.g., https://api.layerto.com or http://localhost:8080 in local dev).
#   Example envsubst command:
#     envsubst '$API_ORIGIN' < infra/headers.conf > /etc/nginx/conf.d/headers.conf
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# 2. Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# 3. Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 4. Frame Options (legacy header fallback for older browsers alongside CSP frame-ancestors)
add_header X-Frame-Options "DENY" always;

# 5. HTTP Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
